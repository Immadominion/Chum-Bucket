      short_description: Follow the calls. Back or fade
      long_description: |-
        Chumbucket is a people-first feed of calls on real prediction markets. See what named people call on live Panta markets, the price they called it at, and how often they have been right.

        Back a call, fade it, or dare a friend to go on record. Calls are free and carry no money.

        Every call locks who made it, which side, when and at what price. When the market resolves on Panta, the call becomes a receipt nobody can edit, and you can share it as a chumbucket.fun link anyone can open.

        Want skin in the game? Take the position on Panta with USDC on Solana mainnet, approved in your own wallet. Chumbucket never holds your funds.

        Funded positions are real money: prices move and you can lose what you put in. Check that prediction markets are legal where you live.
      new_in_version: |-
        A new Chumbucket, built around people and their calls.
        - Follow what people call on live Panta prediction markets
        - Back, fade or dare any call, free
        - Every call becomes a receipt you can share at chumbucket.fun
        - Optionally take the position on Panta with USDC from your own wallet
        - Friends lead to their calls. SOL escrow challenges are retired; earlier ones stay in Settings > History, where an open one can still be settled
        - Crash reports are now opt-in (Settings)
      saga_features: Sign in and approve trades with Mobile Wallet Adapter, including Seed Vault on Seeker.
