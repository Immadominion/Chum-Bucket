solana_mobile_dapp_publisher_portal:
  testing_instructions: |-
    Chumbucket 1.0.34 is a feed of people's calls on live Panta prediction markets. Calls are free; no funds are needed to review the app.
    1. Open the app and sign in with your wallet (Mobile Wallet Adapter / Seed Vault).
    2. Home shows what people are calling. Tap any call to see its receipt: who, which side, when, the entry price, and the result once Panta resolves the market.
    3. Markets: open any market, pick Yes or No, optionally add a reason, and lock your call. It appears on your profile.
    4. On someone else's call, tap Back, Fade or Dare. All are free.
    5. Friends: tapping a friend opens their profile and calls. Nothing in the app starts a SOL escrow; Settings > History lists earlier escrow challenges (a new account has none).
    6. Share a receipt. The link (https://chumbucket.fun/c/...) opens in the app on a phone that has it, and as a web page anywhere else.
    7. Optional, real money: a funded position is a real trade on Panta in USDC on Solana mainnet, approved in your wallet and capped at 100 USDC per approval. Reviewing it does not require placing one.
    8. Settings > Share crash reports is off by default; turning it on is the only way reports are sent.
    Full notes: publishing/LISTING.md in the app repository.
