name: chumbucket
description: "See what people call on real prediction markets, back or fade them, and keep the receipt."

publish_to: "none"

version: 1.0.34+34

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.0 # For responsive design
  google_fonts: ^8.1.0 # For custom fonts
  provider: ^6.1.1 # For state management
  solana: ^0.31.2+1 # Updated Solana blockchain SDK
  tld_parser: ^0.1.0
  bip39: ^1.0.6 # For mnemonic generation
  shared_preferences: ^2.2.2 # For local storage
  flutter_secure_storage: ^9.0.0 # For secure storage
  http: ^1.6.0 # For API requests
  intl: ^0.19.0 # For date formatting
  rive: ^0.13.20
  # MWA - Mobile Wallet Adapter for Solana Mobile (replaces Privy)
  solana_mobile_client: ^0.1.2
  lottie: ^3.3.1
  flutter_dotenv: ^6.0.0
  flutter_otp_text_field: ^1.5.1+1
  supabase_flutter: ^2.9.0
  connectivity_plus: ^7.0.0
  qr_flutter: ^4.1.0
  # Already resolved transitively via supabase_flutter (pubspec.lock pins
  # 6.4.1). Promoted to a direct dependency so the call slice may import it;
  # this adds nothing new to the resolution.
  app_links: ^6.4.1

  # Push Notifications
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.4
  # Crash reports, opt-in only (lib/core/crash/crash_reporting.dart). Pinned to
  # the line that matches the locked firebase_core 3.15.x.
  firebase_crashlytics: ^4.3.10
  flutter_local_notifications: ^17.2.3 # Local notification display

  # Local Database for Development
  sqflite: ^2.3.0 # SQLite database for local development
  path: ^1.8.3 # For database path management
  uuid: ^4.5.1 # For generating unique IDs
  flutter_svg: ^2.3.0 # Basil icon set (Iconify) rendered from bundled SVG assets
  screenshot: ^3.0.0
  share_plus: ^11.1.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  url_launcher: ^6.2.2 # For opening URLs in browser
  webview_flutter: ^4.13.0 # For in-app web browser
  # Already resolved transitively (pubspec.lock pins both). Promoted so the
  # Crossmint checkout can enable Android's Payment Request API (Google Pay)
  # and iOS inline media, as Crossmint's WebView guide requires.
  webview_flutter_android: ^4.10.2
  webview_flutter_wkwebview: ^3.23.1
  coral_xyz: ^1.0.0-beta.5
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  # Enhanced networking
  dio: ^5.4.0 # Better HTTP client
  retry: ^3.1.2 # Retry failed transactions

  # Enhanced crypto utilities
  hex: ^0.2.0 # Hex encoding utilities
  convert: ^3.1.1 # Additional conversion utilities

  # JSON manipulation for Solana transactions
  json_annotation: ^4.8.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  yaml: ^3.1.3 # Already locked; parse the complete asset list in security tests.

  flutter_lints: ^5.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    # Preserve existing body typography without a first-launch font download.
    - assets/fonts/Montserrat/
    # Sheet typeface from the original app; see assets/fonts/Inter/README.md.
    - assets/fonts/Inter/
    - assets/chumbucket_arena_idl.json
    - assets/images/
    - assets/images/states/
    - assets/images/ai_gen/
    - assets/images/ai_gen/logo/
    - assets/images/ai_gen/profile_images/
    # Only 3d-texture.JPG is used at runtime from here. The irfan/ design
    # references are cited in comments and stay in the repo, unbundled.
    - assets/images/open_sourced_design_inspiration/
    - assets/animations/
    - assets/animations/lottie/
    - assets/icons/basil/
    - shorebird.yaml
  fonts:
    - family: PPNeueMachina
      fonts:
        - asset: assets/fonts/PPNeueMachina/PPNeueMachina-Light.otf
          weight: 300
        - asset: assets/fonts/PPNeueMachina/PPNeueMachina-Regular.otf
          weight: 400
        - asset: assets/fonts/PPNeueMachina/PPNeueMachina-Ultrabold.otf
          weight: 800
